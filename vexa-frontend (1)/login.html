<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEXA – Anmelden</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="#0b3d91" stroke-width="3"/><text x="21" y="41" font-family="Barlow Semi Condensed,sans-serif" font-size="25" font-weight="700" fill="#0b3d91" text-anchor="middle">V</text><text x="43" y="41" font-family="Barlow Semi Condensed,sans-serif" font-size="25" font-weight="700" fill="#ff6b00" text-anchor="middle">X</text></svg>
      <span class="logo">VEXA</span>
    </div>
    <p class="mute">Avis &amp; Budget Langzeitmieten</p>
    <h1>Anmelden</h1>
    <label>E-Mail<input id="lm" type="email" autocomplete="username"></label>
    <label>Passwort<input id="lp" type="password" autocomplete="current-password"></label>
    <button class="btn pri block" id="lb">Anmelden</button>
    <p class="err" id="le" role="alert"></p>
    <p class="hint" style="margin-top:14px">Die Zugangsdaten bekommst du vom Chef. Passwort vergessen? Der Chef kann es zurücksetzen.</p>
  </div>
  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
